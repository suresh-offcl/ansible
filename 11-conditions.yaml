- name: 
  hosts: web
  become: yes
  tasks:
  - name: "Check if user exists"
    ansible.builtin.command: id expense
    register: user
    ignore_errors: true
  
  - name: "Create user if not exists"
    ansible.builtin.command: useradd expense
    when: user.rc != 0
  
  - name: "check if user exists"
    ansible.builtin.debug: 
      msg: "{{ user }}"
















  
